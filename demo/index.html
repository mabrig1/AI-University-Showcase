<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning progress demo</title><style>body{font:16px system-ui;background:#111827;color:#eef2ff;max-width:680px;margin:40px auto;padding:20px}label{display:block;padding:16px;background:#203047;margin:8px 0;border-radius:8px}progress{width:100%;height:20px}input{margin-right:10px}</style><h1>AI University — Learning dashboard</h1><p>Independent synthetic demonstration. No real learner data or accredited credentials.</p><progress id="bar" max="4" value="0"></progress><p id="status" aria-live="polite"></p><div id="modules"></div><p id="next"></p><script>const names=['Explore a problem','Design a solution','Build a prototype','Review evidence'],root=document.querySelector('#modules');for(const name of names){const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';label.append(input,document.createTextNode(name));root.append(label);input.onchange=update}function update(){const states=[...root.querySelectorAll('input')].map(x=>x.checked),done=states.filter(Boolean).length;document.querySelector('#bar').value=done;document.querySelector('#status').textContent=done+' of 4 modules · '+done*25+'%';const next=states.indexOf(false);document.querySelector('#next').textContent=next<0?'All example modules marked complete.':'Suggested next step: '+names[next]}update();</script></html>
